<!DOCTYPE html>
<html>
<head>
<title>Admin Portal</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
html{
    scroll-behavior: smooth;
}

body{
    background: linear-gradient(135deg, #fff5f0 0%, #ffe8d9 50%, #fff0e6 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 0;
}

/* Creative Gradient Login */
.login-section{
    height:100vh;
    background: linear-gradient(135deg, #06b6d4 0%, #0891b2 50%, #0369a1 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    position: relative;
    overflow: hidden;
}

.login-section::before{
    content: '';
    position: absolute;
    width: 400px;
    height: 400px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    top: -200px;
    left: -200px;
    animation: float 8s ease-in-out infinite;
}

.login-section::after{
    content: '';
    position: absolute;
    width: 300px;
    height: 300px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 50%;
    bottom: -150px;
    right: -150px;
    animation: float 10s ease-in-out infinite reverse;
}

@keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(20px); }
}

.login-card{
    width: 380px;
    border-radius: 25px;
    background: rgba(255,255,255,0.95);
    color: #333;
    padding: 50px 40px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.2);
    position: relative;
    z-index: 10;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.5);
    animation: slideUp 0.6s ease-out;
}

@keyframes slideUp {
    from {
        transform: translateY(50px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.login-card h3{
    color: #ff6b35;
    font-weight: 700;
    margin-bottom: 10px;
    font-size: 28px;
}

.login-card .subtitle{
    color: #999;
    font-size: 13px;
    margin-bottom: 25px;
}

.login-card .form-control{
    background: #f8f9fa;
    border: 2px solid #e9ecef;
    border-radius: 12px;
    padding: 12px 15px;
    font-size: 14px;
    transition: all 0.3s ease;
    margin-bottom: 12px;
}

.login-card .form-control:focus{
    background: white;
    border-color: #ff6b35;
    box-shadow: 0 0 0 0 rgba(255, 107, 53, 0.1);
}

.login-card .btn{
    background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-weight: 600;
    color: white;
    transition: all 0.3s ease;
    margin-top: 15px;
}

.login-card .btn:hover{
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(255, 107, 53, 0.4);
    color: white;
}

.login-card .btn:active{
    transform: translateY(0);
}

.dashboard{
    display:none;
    background: linear-gradient(135deg, #fff5f0 0%, #ffe8d9 50%, #fff0e6 100%);
    min-height: 100vh;
}

.navbar{
    background: linear-gradient(90deg, #ff6b35 0%, #f7931e 100%) !important;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

.navbar .navbar-brand{
    color: white !important;
    font-weight: 700;
    font-size: 20px;
    transition: all 0.3s ease;
}

.navbar .btn-danger{
    background: #ff6b6b !important;
    border: none;
    border-radius: 8px;
    transition: all 0.3s ease;
}

.navbar .btn-danger:hover{
    background: #ff5252 !important;
    transform: translateY(-2px);
}

.sidebar{
    background: white;
    border-right: 1px solid #e9ecef;
    padding: 20px 0;
    animation: slideInLeft 0.5s ease-out;
}

@keyframes slideInLeft {
    from {
        transform: translateX(-50px);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

.sidebar .btn{
    background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
    border: none;
    border-radius: 12px;
    color: white;
    font-weight: 600;
    margin-bottom: 20px;
    transition: all 0.3s ease;
    width: 90%;
}

.sidebar .btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(255, 107, 53, 0.3);
}

.sidebar .nav-link{
    color: #666 !important;
    border-radius: 8px;
    margin: 8px 10px;
    padding: 12px 15px !important;
    transition: all 0.3s ease;
    font-weight: 500;
}

.sidebar .nav-link:hover{
    background: #f8f9fa;
    color: #ff6b35 !important;
    transform: translateX(5px);
}

.sidebar .nav-link.active{
    background: none;
    color: #666 !important;
    box-shadow: none;
}

.sidebar .progress{
    margin: 15px 0;
}

.sidebar .progress-bar{
    background: linear-gradient(90deg, #ff6b35 0%, #f7931e 100%) !important;
}

.main-content{
    background: linear-gradient(135deg, #fff5f0 0%, #ffe8d9 50%, #fff0e6 100%);
    min-height: 90vh;
    padding: 30px;
}

.section-header{
    color: #333;
    font-weight: 700;
    font-size: 26px;
    margin-bottom: 25px;
    animation: slideInDown 0.5s ease-out;
}

@keyframes slideInDown {
    from {
        transform: translateY(-20px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.card{
    background: white;
    border: none;
    border-radius: 15px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    transition: all 0.3s ease;
    animation: fadeIn 0.5s ease-out;
    margin-bottom: 15px;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: scale(0.95);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.card:hover{
    transform: translateY(-5px);
    box-shadow: 0 10px 35px rgba(0,0,0,0.15);
}

.card p{
    color: #666;
    margin-bottom: 8px;
}

.card small{
    color: #999;
    font-size: 12px;
}

.btn-success{
    background: linear-gradient(135deg, #00d084 0%, #00a86b 100%) !important;
    border: none;
    border-radius: 8px;
    transition: all 0.3s ease;
}

.btn-success:hover{
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 208, 132, 0.3);
}

.btn-info{
    background: linear-gradient(135deg, #2980b9 0%, #1f618d 100%) !important;
    border: none;
    border-radius: 8px;
    transition: all 0.3s ease;
    color: white !important;
    font-weight: 600 !important;
    padding: 8px 16px !important;
}

.btn-info:hover{
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(40, 116, 240, 0.5);
    background: linear-gradient(135deg, #1f618d 0%, #154360 100%) !important;
}

.btn-info:active{
    transform: translateY(0);
}

.btn-danger{
    border-radius: 8px;
    transition: all 0.3s ease;
}

.btn-danger:hover{
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
}

.form-control{
    border: 2px solid #e9ecef;
    border-radius: 10px;
    padding: 10px 15px;
    transition: all 0.3s ease;
    background: white !important;
    color: #333 !important;
}

.form-control:focus{
    border-color: #ff6b35;
    box-shadow: 0 0 0 0 rgba(255, 107, 53, 0.1);
    background: white !important;
    color: #333 !important;
}

textarea.form-control{
    background: #f8f9fa !important;
    color: #333 !important;
}

textarea.form-control:focus{
    background: white !important;
    color: #333 !important;
}

.badge{
    border-radius: 8px;
    padding: 6px 12px;
    font-weight: 600;
}

.bg-success{
    background: linear-gradient(135deg, #00d084 0%, #00a86b 100%) !important;
}

.bg-warning{
    background: linear-gradient(135deg, #ffd93d 0%, #ff9f1c 100%) !important;
}

.bg-danger{
    background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%) !important;
}

/* Custom Alert Styles */
.custom-alert-overlay{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.custom-alert-box{
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    text-align: center;
    max-width: 400px;
    animation: slideIn 0.3s ease-out;
}

@keyframes slideIn {
    from {
        transform: translateY(-50px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.custom-alert-box h5{
    margin-bottom: 15px;
    font-weight: 600;
}

.custom-alert-box p{
    color: #666;
    margin-bottom: 20px;
}

.custom-alert-box button{
    border-radius: 8px;
    font-weight: 500;
}
</style>

</head>
<body>

<!-- LOGIN -->
<div class="login-section" id="loginPage">
    <div class="login-card text-center">
        <h3>🛠 Smart Drive Admin</h3>
        <p class="subtitle">Admin Control Panel</p>
        <input type="text" id="adminUser" class="form-control" placeholder="Username or Email">
        <input type="password" id="adminPass" class="form-control" placeholder="Password">
        <button class="btn btn-light w-100" onclick="login()">Login</button>
    </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">

<nav class="navbar px-4">
    <span class="navbar-brand">☁️ Smart Drive Admin - <span id="adminNameDisplay">Admin</span></span>
    <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
</nav>

<div class="container-fluid">
<div class="row">

<div class="col-md-2 bg-white d-flex flex-column p-3 border-end sidebar">

    <button class="btn btn-primary mb-3" onclick="document.getElementById('adminFileInput').click()">+ Add</button>
    <input type="file" id="adminFileInput" style="display:none;" onchange="addAdminFile()" />

    <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link active" href="#" onclick="showAdminFiles()">📂 All Files</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="showAdminTrash()">🗑️ Trash</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="loadAdminComplaints()">📢 Complaints</a></li>
    </ul>

    <div class="mt-auto border-top pt-3">
        <small>Storage</small>
        <div class="progress my-2" style="height:6px;">
            <div class="progress-bar bg-primary" style="width:60%"></div>
        </div>
        <small>12GB of 20GB used</small>
    </div>

</div>

<div class="col-md-10 p-4 main-content">

    <!-- Files Section -->
    <div id="adminFilesSection" style="display:none;">
        <h4 class="section-header">📂 All Files</h4>
        <div id="adminFilesList"></div>
    </div>

    <!-- Trash Section -->
    <div id="adminTrashSection" style="display:none;">
        <h4 class="section-header">🗑️ Trash</h4>
        <div id="adminTrashList"></div>
    </div>

    <!-- Complaints Section -->
    <div id="adminComplaintSection">
        <h4 class="section-header d-flex justify-content-between align-items-center">📢 All Complaints
            <button class="btn btn-danger btn-sm" onclick="clearAllComplaints()">Clear All</button>
        </h4>
        <div id="adminComplaintsList"></div>
    </div>

</div>
</div>
</div>

</div>

<script>
var currentAdmin = "";

function showAlert(title, message, icon = "✅", type = "success"){
    document.getElementById("alertIcon").textContent = icon;
    document.getElementById("alertTitle").textContent = title;
    document.getElementById("alertMessage").textContent = message;
    
    let overlay = document.getElementById("customAlertOverlay");
    overlay.style.display = "flex";
    
    // Auto close after 3 seconds
    setTimeout(() => {
        closeAlert();
    }, 3000);
}

function closeAlert(){
    document.getElementById("customAlertOverlay").style.display = "none";
}


function login(){
    let adminInput = document.getElementById("adminUser").value;
    let adminPassword = document.getElementById("adminPass").value;
    
    // Admin usernames and emails mapping
    let adminCredentials = {
        "Admin1": "admin1@drive.com",
        "Admin2": "admin2@drive.com",
        "Admin3": "admin3@drive.com"
    };
    
    let currentAdminName = "";
    
    // Check if input matches any admin username or email
    for(let admin in adminCredentials){
        if(adminInput === admin || adminInput === adminCredentials[admin]){
            currentAdminName = admin;
            break;
        }
    }
    
    // Check if input ends with @klh.edu.in (like admin1@klh.edu.in, admin2@klh.edu.in, etc.)
    if(!currentAdminName && adminInput.endsWith("@klh.edu.in")){
        let emailPrefix = adminInput.substring(0, adminInput.indexOf("@")).toLowerCase();
        if(emailPrefix === "admin1") currentAdminName = "Admin1";
        else if(emailPrefix === "admin2") currentAdminName = "Admin2";
        else if(emailPrefix === "admin3") currentAdminName = "Admin3";
    }
    
    if(currentAdminName && adminPassword === "1234"){
        currentAdmin = currentAdminName;
        localStorage.setItem("currentAdminSession", currentAdminName);
        document.getElementById("loginPage").style.display="none";
        document.getElementById("dashboard").style.display="block";
        document.getElementById("adminNameDisplay").innerText = currentAdminName;
        showAlert("Welcome!", `Login successful as ${currentAdminName}`, "👋", "success");
        loadAdminComplaints();
    } else {
        showAlert("Login Failed", "Invalid Admin Credentials", "❌", "error");
    }
}

function logout(){
    localStorage.removeItem("currentAdminSession");
    location.reload();
}

// Add file function
function addAdminFile(){
    let fileInput = document.getElementById('adminFileInput');
    if(fileInput.files.length > 0){
        let file = fileInput.files[0];
        let files = JSON.parse(localStorage.getItem("adminFiles")) || [];
        
        files.push({
            name: file.name,
            size: file.size,
            date: new Date().toLocaleDateString(),
            uploadedBy: "Admin"
        });
        
        localStorage.setItem("adminFiles", JSON.stringify(files));
        fileInput.value = "";
        showAdminFiles();
        showAlert("File Added", "File uploaded successfully!", "📁", "success");
    }
}

// Show All Files
function showAdminFiles(){
    hideAdminSections();
    document.getElementById("adminFilesSection").style.display="block";
    loadAdminFiles();
}

// Load admin files
function loadAdminFiles(){
    let files = JSON.parse(localStorage.getItem("adminFiles")) || [];
    let output = "";
    
    if(files.length === 0){
        output = "<p class='text-muted'>No files added yet.</p>";
    } else {
        files.forEach((f, index) => {
            let icon = f.name.endsWith('.pdf') ? '📄' : f.name.endsWith('.xlsx') || f.name.endsWith('.xls') ? '📊' : '📁';
            output += `
            <div class="card p-3 mt-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="mb-1"><strong>${icon} ${f.name}</strong></p>
                        <small class="text-muted">Added on ${f.date}</small>
                    </div>
                    <button class="btn btn-sm btn-danger" onclick="deleteAdminFile(${index})">Delete</button>
                </div>
            </div>`;
        });
    }
    
    document.getElementById("adminFilesList").innerHTML = output;
}

// Delete admin file
function deleteAdminFile(index){
    let files = JSON.parse(localStorage.getItem("adminFiles")) || [];
    let deletedFile = files.splice(index, 1)[0];
    localStorage.setItem("adminFiles", JSON.stringify(files));
    
    let trash = JSON.parse(localStorage.getItem("adminTrash")) || [];
    trash.push({...deletedFile, deletedDate: new Date().toLocaleDateString()});
    localStorage.setItem("adminTrash", JSON.stringify(trash));
    
    loadAdminFiles();
}

// Show Trash
function showAdminTrash(){
    hideAdminSections();
    document.getElementById("adminTrashSection").style.display="block";
    loadAdminTrash();
}

// Load admin trash
function loadAdminTrash(){
    let trash = JSON.parse(localStorage.getItem("adminTrash")) || [];
    let output = "";
    
    if(trash.length === 0){
        output = "<p class='text-muted'>Trash is empty.</p>";
    } else {
        trash.forEach((f, index) => {
            let icon = f.name.endsWith('.pdf') ? '📄' : f.name.endsWith('.xlsx') || f.name.endsWith('.xls') ? '📊' : '📁';
            output += `
            <div class="card p-3 mt-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="mb-1"><strong>${icon} ${f.name}</strong></p>
                        <small class="text-muted">Deleted on ${f.deletedDate}</small>
                    </div>
                    <button class="btn btn-sm btn-warning" onclick="restoreAdminFile(${index})">Restore</button>
                </div>
            </div>`;
        });
    }
    
    document.getElementById("adminTrashList").innerHTML = output;
}

// Restore admin file
function restoreAdminFile(index){
    let trash = JSON.parse(localStorage.getItem("adminTrash")) || [];
    let restoredFile = trash.splice(index, 1)[0];
    localStorage.setItem("adminTrash", JSON.stringify(trash));
    
    let files = JSON.parse(localStorage.getItem("adminFiles")) || [];
    files.push({name: restoredFile.name, size: restoredFile.size, date: new Date().toLocaleDateString(), uploadedBy: "Admin"});
    localStorage.setItem("adminFiles", JSON.stringify(files));
    
    loadAdminTrash();
}

// Hide admin sections
function hideAdminSections(){
    document.getElementById("adminFilesSection").style.display="none";
    document.getElementById("adminTrashSection").style.display="none";
    document.getElementById("adminComplaintSection").style.display="none";
}

function loadAdminComplaints(){
    hideAdminSections();
    document.getElementById("adminComplaintSection").style.display="block";

    fetch("http://localhost:8080/api/complaints")
    .then(response => response.json())
    .then(data => {
        displayAdminComplaints(data);
    })
    .catch(error => {
        console.error("Error loading complaints:", error);
        document.getElementById("adminComplaintsList").innerHTML =
            "<p class='text-muted'>Error loading complaints.</p>";
    });
}


function displayAdminComplaints(data){

    let container = document.getElementById("adminComplaintsList");
    container.innerHTML = "";

    if(data.length === 0){
        container.innerHTML = "<p>No complaints found.</p>";
        return;
    }

    let output = "";

    data.forEach((c) => {
        if(c.toAdmin === currentAdmin){

            output += `
            <div class="card p-3 mt-3">
                <h6>${c.title}</h6>
                <p>${c.description}</p>
                <small>FROM: ${c.userName}</small>

                <div class="mt-2 mb-2">
                    <button class="btn btn-success btn-sm"
                        onclick="markSolved(${c.id})">Solved</button>

                    <button class="btn btn-danger btn-sm"
                        onclick="markCannotSolve(${c.id})">Cannot Solve</button>

                    <button class="btn btn-warning btn-sm"
                        onclick="markPending(${c.id})">Pending</button>
                </div>

                <textarea id="remarks_${c.id}"
                    class="form-control mb-2"
                    placeholder="Enter remarks...">${c.remarks || ""}</textarea>

                <button class="btn btn-info btn-sm"
                    onclick="saveRemarks(${c.id})">Save Remarks</button>
            </div>
            `;
        }
    });

    container.innerHTML = output || "<p>No complaints for you.</p>";
}

function updateStatus(index, status){
    let complaints = JSON.parse(localStorage.getItem("complaints")) || [];
    complaints[index].status = status;
    
    loadAdminComplaints();
}

function markSolved(id){
    updateComplaintStatus(id, "Solved");
}

function markCannotSolve(id){
    updateComplaintStatus(id, "Cannot Solve");
}

function markPending(id){
    updateComplaintStatus(id, "Pending");
}

function updateComplaintStatus(id, status){

    fetch(`http://localhost:8080/api/complaints/${id}`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            status: status
        })
    })
    .then(() => {
        loadAdminComplaints();
    });
}

function saveRemarks(id){
    let remarks = document.getElementById("remarks_" + id).value;

    fetch(`http://localhost:8080/api/complaints/${id}`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            remarks: remarks
        })
    })
    .then(() => {
        showAlert("Saved", "Remarks saved successfully! 💾");
        loadAdminComplaints();
    })
    .catch(error => {
        console.error(error);
    });
}

function clearAllComplaints(){
    if(confirm("Are you sure you want to delete all complaints?")){

        fetch("http://localhost:8080/api/complaints", {
            method: "DELETE"
        })
        .then(() => {

            localStorage.removeItem("allComplaints");

            showAlert("Cleared", "All complaints deleted from database 🗑️");
            loadAdminComplaints();
        });
    }
}

window.onload = function(){
    // Check if admin is already logged in from previous session
    let savedAdminSession = localStorage.getItem("currentAdminSession");
    if(savedAdminSession){
        currentAdmin = savedAdminSession;
        document.getElementById("loginPage").style.display="none";
        document.getElementById("dashboard").style.display="block";
        document.getElementById("adminNameDisplay").innerText = currentAdmin;
        loadAdminComplaints();
    }
};

</script>

<!-- Custom Alert Modal -->
<div class="custom-alert-overlay" id="customAlertOverlay">
    <div class="custom-alert-box">
        <h5 id="alertIcon" style="font-size: 40px; margin-bottom: 10px;">✅</h5>
        <h5 id="alertTitle">Success</h5>
        <p id="alertMessage">Operation completed successfully</p>
        <button class="btn btn-primary px-5" onclick="closeAlert()">OK</button>
    </div>
</div>

</body>
</html>
