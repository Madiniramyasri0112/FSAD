<!DOCTYPE html>
<html>
<head>
<title>User Portal</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
html{
    scroll-behavior: smooth;
}

body{
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 0;
}

.login-section{
    height:100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    position: relative;
    overflow: hidden;
}

.login-section::before{
    content: '';
    position: absolute;
    width: 400px;
    height: 400px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    top: -200px;
    left: -200px;
    animation: float 8s ease-in-out infinite;
}

.login-section::after{
    content: '';
    position: absolute;
    width: 300px;
    height: 300px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 50%;
    bottom: -150px;
    right: -150px;
    animation: float 10s ease-in-out infinite reverse;
}

@keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(20px); }
}

.login-card{
    width: 380px;
    border-radius: 25px;
    background: rgba(255,255,255,0.95);
    color: #333;
    padding: 50px 40px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.2);
    position: relative;
    z-index: 10;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.5);
    animation: slideUp 0.6s ease-out;
}

@keyframes slideUp {
    from {
        transform: translateY(50px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.login-card h3{
    color: #667eea;
    font-weight: 700;
    margin-bottom: 10px;
    font-size: 28px;
}

.login-card .subtitle{
    color: #999;
    font-size: 13px;
    margin-bottom: 25px;
}

.login-card .form-control{
    background: #f8f9fa;
    border: 2px solid #e9ecef;
    border-radius: 12px;
    padding: 12px 15px;
    font-size: 14px;
    transition: all 0.3s ease;
    margin-bottom: 12px;
}

.login-card .form-control:focus{
    background: white;
    border-color: #667eea;
    box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.1);
}

.login-card .btn{
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-weight: 600;
    transition: all 0.3s ease;
    margin-top: 15px;
}

.login-card .btn:hover{
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
}

.login-card .btn:active{
    transform: translateY(0);
}

.dashboard{
    display:none;
    background: linear-gradient(135deg, #f0e8ff 0%, #e6d9f5 50%, #f5e8ff 100%);
    min-height: 100vh;
}

.navbar{
    background: linear-gradient(90deg, #667eea 0%, #764ba2 100%) !important;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

.navbar .navbar-brand{
    color: white !important;
    font-weight: 700;
    font-size: 20px;
    transition: all 0.3s ease;
}

.navbar .btn-danger{
    background: #ff6b6b !important;
    border: none;
    border-radius: 8px;
    transition: all 0.3s ease;
}

.navbar .btn-danger:hover{
    background: #ff5252 !important;
    transform: translateY(-2px);
}

.sidebar{
    background: white;
    border-right: 1px solid #e9ecef;
    padding: 20px 0;
    animation: slideInLeft 0.5s ease-out;
}

@keyframes slideInLeft {
    from {
        transform: translateX(-50px);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

.sidebar .btn{
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    border-radius: 12px;
    color: white;
    font-weight: 600;
    margin-bottom: 20px;
    transition: all 0.3s ease;
    width: 90%;
}

.sidebar .btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
}

.sidebar .nav-link{
    color: #666 !important;
    border-radius: 8px;
    margin: 8px 10px;
    padding: 12px 15px !important;
    transition: all 0.3s ease;
    font-weight: 500;
}

.sidebar .nav-link:hover{
    background: #f8f9fa;
    color: #667eea !important;
    transform: translateX(5px);
}

.sidebar .nav-link.active{
    background: none;
    color: #666 !important;
    box-shadow: none;
}

.sidebar .progress{
    margin: 15px 0;
}

.sidebar .progress-bar{
    background: linear-gradient(90deg, #667eea 0%, #764ba2 100%) !important;
}

.main-content{
    background: linear-gradient(135deg, #f0e8ff 0%, #e6d9f5 50%, #f5e8ff 100%);
    min-height: 90vh;
    padding: 30px;
}

.section-header{
    color: #333;
    font-weight: 700;
    font-size: 26px;
    margin-bottom: 25px;
    animation: slideInDown 0.5s ease-out;
}

@keyframes slideInDown {
    from {
        transform: translateY(-20px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.card{
    background: white;
    border: none;
    border-radius: 15px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    transition: all 0.3s ease;
    animation: fadeIn 0.5s ease-out;
    margin-bottom: 15px;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: scale(0.95);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.card:hover{
    transform: translateY(-5px);
    box-shadow: 0 10px 35px rgba(0,0,0,0.15);
}

.card p{
    color: #666;
    margin-bottom: 8px;
}

.card small{
    color: #999;
    font-size: 12px;
}

.btn-success{
    background: linear-gradient(135deg, #00d084 0%, #00a86b 100%) !important;
    border: none;
    border-radius: 8px;
    transition: all 0.3s ease;
}

.btn-success:hover{
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 208, 132, 0.3);
}

.btn-danger{
    border-radius: 8px;
    transition: all 0.3s ease;
}

.btn-danger:hover{
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
}

.form-control{
    border: 2px solid #e9ecef;
    border-radius: 10px;
    padding: 10px 15px;
    transition: all 0.3s ease;
    background: white !important;
    color: #333 !important;
}

.form-control:focus{
    border-color: #667eea;
    box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.1);
    background: white !important;
    color: #333 !important;
}

textarea.form-control{
    background: #f8f9fa !important;
    color: #333 !important;
}

textarea.form-control:focus{
    background: white !important;
    color: #333 !important;
}

.badge{
    border-radius: 8px;
    padding: 6px 12px;
    font-weight: 600;
}

.bg-success{
    background: linear-gradient(135deg, #00d084 0%, #00a86b 100%) !important;
}

.bg-warning{
    background: linear-gradient(135deg, #ffd93d 0%, #ff9f1c 100%) !important;
}

.bg-danger{
    background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%) !important;
}

.bg-info{
    background: linear-gradient(135deg, #00bcd4 0%, #0097a7 100%) !important;
}


/* Custom Alert Styles */
.custom-alert-overlay{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.custom-alert-box{
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    text-align: center;
    max-width: 400px;
    animation: slideIn 0.3s ease-out;
}

@keyframes slideIn {
    from {
        transform: translateY(-50px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.custom-alert-box h5{
    margin-bottom: 15px;
    font-weight: 600;
}

.custom-alert-box p{
    color: #666;
    margin-bottom: 20px;
}

.custom-alert-box button{
    border-radius: 8px;
    font-weight: 500;
}
</style>

</head>
<body>

<!-- LOGIN -->
<div class="login-section" id="loginPage">
    <div class="login-card text-center">
        <h3>👤 Smart Drive</h3>
        <p class="subtitle">Your Personal Cloud Storage</p>
        <input type="text" id="userName" class="form-control" placeholder="Username or Email">
        <input type="password" id="userPass" class="form-control" placeholder="Password">
        <button class="btn btn-light w-100" onclick="login()">Login</button>
    </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">

<nav class="navbar px-4">
    <span class="navbar-brand">☁️ Smart Drive</span>
    <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
</nav>

<div class="container-fluid">
<div class="row">

<div class="col-md-2 bg-white d-flex flex-column p-3 border-end sidebar">

    <button class="btn btn-primary mb-3" onclick="document.getElementById('fileInput').click()">+ Add</button>
    <input type="file" id="fileInput" style="display:none;" onchange="addFile()" />

    <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link active" href="#" onclick="showMyDrive()">📄 Recent</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="showTrash()">🗑️ Trash</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="showSharedByMe()">📤 Shared by me</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="showUserComplaints()">📢 My Complaints</a></li>
    </ul>

    <div class="mt-auto border-top pt-3">
        <small>Storage</small>
        <div class="progress my-2" style="height:6px;">
            <div class="progress-bar bg-danger" style="width:35%"></div>
        </div>
        <small>5GB of 15GB used</small>
    </div>

</div>

<div class="col-md-10 p-4 main-content">

    <!-- Drive Section (Recent Files) -->
    <div id="driveSection">
        <h4 class="section-header">📄 Recent Files</h4>
        <div id="filesList"></div>
    </div>

    <!-- Trash Section -->
    <div id="trashSection" style="display:none;">
        <h4 class="section-header">🗑️ Trash</h4>
        <div id="trashList"></div>
    </div>

    <!-- Shared by me Section -->
    <div id="sharedSection" style="display:none;">
        <h4 class="section-header">📤 Shared by me</h4>
        <div id="sharedList"></div>
    </div>

    <!-- Complaint Section -->
    <div id="complaintSection" style="display:none;">
        <h4 class="section-header d-flex justify-content-between align-items-center">📢 My Complaints
            <button class="btn btn-danger btn-sm" onclick="clearAllUserComplaints()">Clear All</button>
        </h4>

        <!-- Add Complaint Form -->
        <div class="card p-3 mt-3">
            <select id="complaintTo" class="form-control mb-2">
                <option value="">Select Admin (TO:)</option>
                <option value="Admin1">Admin1</option>
                <option value="Admin2">Admin2</option>
                <option value="Admin3">Admin3</option>
            </select>
            <input type="text" id="complaintTitle" class="form-control mb-2" placeholder="Complaint Title">
            <textarea id="complaintDesc" class="form-control mb-2" placeholder="Describe your issue"></textarea>
            <button class="btn btn-success" onclick="addComplaint()">Submit Complaint</button>
        </div>

        <!-- All Complaints -->
        <div id="userComplaintsList" class="mt-4"></div>
    </div>

</div>
</div>
</div>

</div>

<script>

function showAlert(title, message, icon = "✅", type = "success"){
    document.getElementById("alertIcon").textContent = icon;
    document.getElementById("alertTitle").textContent = title;
    document.getElementById("alertMessage").textContent = message;
    
    let overlay = document.getElementById("customAlertOverlay");
    overlay.style.display = "flex";
    
    // Auto close after 3 seconds
    setTimeout(() => {
        closeAlert();
    }, 3000);
}

function closeAlert(){
    document.getElementById("customAlertOverlay").style.display = "none";
}

function showConfirm(message, onConfirm){
    if(confirm(message)){
        onConfirm();
    }
}

function login(){
    let input = document.getElementById("userName").value;
    let password = document.getElementById("userPass").value;
    
    // Allow login with username OR any email ending with @klh.edu.in
    if((input === "Madini Ramyasri" || input.endsWith("@klh.edu.in")) &&
       password === "1234"){
        localStorage.setItem("currentUserSession", "logged_in");
        document.getElementById("loginPage").style.display="none";
        document.getElementById("dashboard").style.display="block";
        showAlert("Welcome!", "Login successful. Enjoy your drive!", "👋", "success");
    } else {
        showAlert("Login Failed", "Invalid Username or Password", "❌", "error");
    }
}

function logout(){
    localStorage.removeItem("currentUserSession");
    location.reload();
}
</script>
<script>

// Initialize files on page load
window.addEventListener('load', function(){
    // Check if user is already logged in from previous session
    let savedUserSession = localStorage.getItem("currentUserSession");
    if(savedUserSession){
        document.getElementById("loginPage").style.display="none";
        document.getElementById("dashboard").style.display="block";
        loadFiles();
    }
});

// Add file function
function addFile(){
    let fileInput = document.getElementById('fileInput');
    if(fileInput.files.length > 0){
        let file = fileInput.files[0];
        let files = JSON.parse(localStorage.getItem("userFiles")) || [];
        
        files.push({
            name: file.name,
            size: file.size,
            date: new Date().toLocaleDateString(),
            status: "Active"
        });
        
        localStorage.setItem("userFiles", JSON.stringify(files));
        fileInput.value = "";
        loadFiles();
        showAlert("File Added", "Your file has been uploaded successfully!", "📁", "success");
    }
}

// Load user files
function loadFiles(){
    let files = JSON.parse(localStorage.getItem("userFiles")) || [];
    let output = "";
    
    if(files.length === 0){
        output = "<p class='text-muted'>No files added yet. Click '+ Add' to upload files.</p>";
    } else {
        files.forEach((f, index) => {
            let icon = f.name.endsWith('.pdf') ? '📄' : f.name.endsWith('.xlsx') || f.name.endsWith('.xls') ? '📊' : '📁';
            output += `
            <div class="card p-3 mt-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="mb-1"><strong>${icon} ${f.name}</strong></p>
                        <small class="text-muted">Added on ${f.date}</small>
                    </div>
                    <button class="btn btn-sm btn-danger" onclick="deleteFile(${index})">Delete</button>
                </div>
            </div>`;
        });
    }
    
    document.getElementById("filesList").innerHTML = output;
}

// Delete file
function deleteFile(index){
    let files = JSON.parse(localStorage.getItem("userFiles")) || [];
    let deletedFile = files.splice(index, 1)[0];
    localStorage.setItem("userFiles", JSON.stringify(files));
    
    let trash = JSON.parse(localStorage.getItem("userTrash")) || [];
    trash.push({...deletedFile, deletedDate: new Date().toLocaleDateString()});
    localStorage.setItem("userTrash", JSON.stringify(trash));
    
    loadFiles();
}

// Show My Drive (Recent)
function showMyDrive(){
    hideAllSections();
    document.getElementById("driveSection").style.display="block";
    loadFiles();
}

// Show Trash
function showTrash(){
    hideAllSections();
    document.getElementById("trashSection").style.display="block";
    loadTrash();
}

// Load trash files
function loadTrash(){
    let trash = JSON.parse(localStorage.getItem("userTrash")) || [];
    let output = "";
    
    if(trash.length === 0){
        output = "<p class='text-muted'>Trash is empty.</p>";
    } else {
        trash.forEach((f, index) => {
            let icon = f.name.endsWith('.pdf') ? '📄' : f.name.endsWith('.xlsx') || f.name.endsWith('.xls') ? '📊' : '📁';
            output += `
            <div class="card p-3 mt-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="mb-1"><strong>${icon} ${f.name}</strong></p>
                        <small class="text-muted">Deleted on ${f.deletedDate}</small>
                    </div>
                    <button class="btn btn-sm btn-warning" onclick="restoreFile(${index})">Restore</button>
                </div>
            </div>`;
        });
    }
    
    document.getElementById("trashList").innerHTML = output;
}

// Restore file from trash
function restoreFile(index){
    let trash = JSON.parse(localStorage.getItem("userTrash")) || [];
    let restoredFile = trash.splice(index, 1)[0];
    localStorage.setItem("userTrash", JSON.stringify(trash));
    
    let files = JSON.parse(localStorage.getItem("userFiles")) || [];
    files.push({name: restoredFile.name, size: restoredFile.size, date: new Date().toLocaleDateString(), status: "Active"});
    localStorage.setItem("userFiles", JSON.stringify(files));
    
    loadTrash();
}

// Show Shared by me
function showSharedByMe(){
    hideAllSections();
    document.getElementById("sharedSection").style.display="block";
    loadShared();
}

// Load shared files
function loadShared(){
    let output = "<p class='text-muted'>No files shared yet.</p>";
    document.getElementById("sharedList").innerHTML = output;
}

// Show Complaints
function showUserComplaints(){
    hideAllSections();
    document.getElementById("complaintSection").style.display="block";
    loadUserComplaints();
}

// Hide all sections except active one
function hideAllSections(){
    document.getElementById("driveSection").style.display="none";
    document.getElementById("trashSection").style.display="none";
    document.getElementById("sharedSection").style.display="none";
    document.getElementById("complaintSection").style.display="none";
}

// Add complaint
function addComplaint(){
    let adminTo = document.getElementById("complaintTo").value;
    let title = document.getElementById("complaintTitle").value;
    let desc = document.getElementById("complaintDesc").value;

    if(adminTo === "" || title === "" || desc === ""){
        showAlert("Incomplete Form", "Please fill all fields before submitting", "⚠️", "warning");
        return;
    }

    fetch("http://localhost:8080/api/complaints", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        userName: "User",
        toAdmin: adminTo,
        title: title,
        description: desc
    })
})
.then(response => response.json())
.then(data => {
    showAlert("Complaint Submitted", `Sent to ${adminTo}`, "📬", "success");
    loadUserComplaints();
})
.catch(error => console.error(error));

    document.getElementById("complaintTo").value="";
    document.getElementById("complaintTitle").value="";
    document.getElementById("complaintDesc").value="";

    showAlert("Complaint Submitted", `Your complaint has been sent to ${adminTo}`, "📬", "success");
    loadUserComplaints();
}

// Load user complaints
function loadUserComplaints(){

    fetch("http://localhost:8080/api/complaints")
    .then(response => response.json())
    .then(data => {

        displayUserComplaints(data);

    })
    .catch(error => {
        console.error(error);
        document.getElementById("userComplaintsList").innerHTML =
            "<p class='text-muted'>Error loading complaints.</p>";
    });
}
// Refresh complaints every 3 seconds to show real-time updates
setInterval(function(){
    if(document.getElementById("complaintSection") && document.getElementById("complaintSection").style.display !== "none"){
        loadUserComplaints();
    }
}, 3000);

function displayUserComplaints(data){
    let output = "";

    data.forEach(c => {
        if(c.userName === "User"){
            let statusColor = c.status === 'Solved' ? '#00d084' : 
                             c.status === 'Pending' ? '#ffd93d' :
                             c.status === 'Cannot Solve' ? '#ff6b6b' : 'transparent';
            
            let statusDisplay = c.status ? `<span class="badge" style="background-color: ${statusColor}; color: ${c.status === 'Pending' ? '#333' : 'white'}; font-weight: 600; margin-left: 10px;">${c.status}</span>` : '';
            
            output += `
            <div class="card p-3 mt-2">
                <div style="display: flex; justify-content: space-between; align-items: start;">
                    <div style="flex: 1;">
                        <h6 style="margin-bottom: 10px; color: #333; font-weight: 700;">${c.title}</h6>
                        <p style="margin-bottom: 8px; color: #666; font-size: 14px;">${c.description}</p>
                        <small style="color: #999;">TO: ${c.toAdmin}</small>
                    </div>
                    <div>
                        ${statusDisplay}
                    </div>
                </div>
                
                <!-- Remarks Display -->
                ${c.remarks ? `<div style="border-top: 1px solid #e9ecef; padding-top: 12px; margin-top: 12px; background: #f9f9f9; padding: 12px; border-radius: 8px;">
                    <small style="font-weight: 600; color: #333; display: block; margin-bottom: 6px;">📝 Admin Remarks:</small>
                    <p style="color: #666; font-size: 13px; margin: 0;">${c.remarks}</p>
                </div>` : ''}
            </div>`;
        }
    });

    document.getElementById("userComplaintsList").innerHTML =
        output || "<p class='text-muted'>No complaints yet.</p>";
}
function clearAllUserComplaints(){
    if(confirm("Are you sure you want to delete all your complaints? This action cannot be undone.")){
        localStorage.removeItem("complaints");
        showAlert("Cleared", "All complaints have been deleted", "🗑️", "success");
        loadUserComplaints();
    }
}

</script>
<!-- Custom Alert Modal -->
<div class="custom-alert-overlay" id="customAlertOverlay">
    <div class="custom-alert-box">
        <h5 id="alertIcon" style="font-size: 40px; margin-bottom: 10px;">✅</h5>
        <h5 id="alertTitle">Success</h5>
        <p id="alertMessage">Operation completed successfully</p>
        <button class="btn btn-primary px-5" onclick="closeAlert()">OK</button>
    </div>
</div>

</body>
</html>
